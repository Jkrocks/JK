name: TejasAI
options:
  bundleIdPrefix: ai.tejas
  deploymentTarget:
    iOS: "15.0"
targets:
  TejasAI:
    type: application
    platform: iOS
    sources:
      - path: Sources
      - path: Resources
      - path: ../shared/connect.html
        buildPhase: resources
    info:
      path: Sources/Info.plist
      properties:
        CFBundleDisplayName: Tejas AI
        CFBundleShortVersionString: "1.0.0"
        CFBundleVersion: "1"
        UILaunchScreen:
          UIColorName: LaunchBackground
        NSMicrophoneUsageDescription: Tejas listens when you tap the orb, so you can talk to it.
        NSLocalNetworkUsageDescription: Tejas looks for your family's home computer on your Wi-Fi.
        NSAppTransportSecurity:
          NSAllowsLocalNetworking: true
        UIStatusBarStyle: UIStatusBarStyleLightContent
        UIViewControllerBasedStatusBarAppearance: false
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: ai.tejas.app
        TARGETED_DEVICE_FAMILY: "1,2"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        SWIFT_VERSION: "5.0"
