name: Build TEJAS ISO

on:
  workflow_dispatch:
  push:
    branches: [main, tejas-os]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: build-iso
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Make room on the build machine
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Build the ISO inside Debian 13
        run: |
          docker run --rm --privileged \
            -v "$PWD":/build -w /build \
            debian:trixie \
            bash -c "chmod +x build.sh auto/* config/hooks/live/*.hook.chroot config/includes.chroot/usr/bin/* && ./build.sh"

      - name: Show the end of the build log
        if: always()
        run: sudo tail -n 120 build.log || true

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: tejas-1.0-amd64
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0
          retention-days: 30

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14
