name: Build TEJAS ISO

on:
  workflow_dispatch:
    inputs:
      edition:
        description: "full (5 GB, every app) or lite (one file under 2 GB)"
        default: lite
  push:
    branches: [main, tejas-os]
    paths-ignore:
      - "**.md"
      - "docs/**"

concurrency:
  group: build-iso-${{ inputs.edition || 'lite' }}
  cancel-in-progress: true

permissions:
  contents: write

env:
  EDITION: ${{ inputs.edition || 'lite' }}

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 180
    steps:
      - name: Make room on the build machine
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          sudo docker image prune --all --force
          df -h /

      - uses: actions/checkout@v4

      - name: Build the ISO inside Debian 13
        run: |
          docker run --rm --privileged \
            -e EDITION="$EDITION" -v "$PWD":/build -w /build \
            debian:trixie \
            bash -c "chmod +x build.sh auto/* config/hooks/live/*.hook.chroot config/includes.chroot/usr/bin/* && ./build.sh"

      - name: Show the end of the build log
        if: always()
        run: sudo tail -n 120 build.log || true

      - name: Upload the ISO
        uses: actions/upload-artifact@v4
        with:
          name: tejas-1.0-${{ env.EDITION }}-amd64
          path: |
            out/*.iso
            out/*.sha256
          compression-level: 0
          retention-days: 30

      - name: Upload the build log
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: build-log
          path: build.log
          retention-days: 14

      - name: Publish to the public download page
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ISO=$(ls out/*.iso | head -1)
          [ -f out/biggest-packages.txt ] && echo "::notice title=Biggest packages ($(du -h "$ISO" | cut -f1) ISO)::$(head -30 out/biggest-packages.txt | sed 's/  */ /g' | tr '\n' ';')"
          sudo rm -rf chroot binary cache .build   # room to cut the full edition into pieces
          sudo chown -R "$(id -u)" out
          bash .github/publish.sh "$ISO"
