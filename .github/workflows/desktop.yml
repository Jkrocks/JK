name: Desktop app
on:
  push:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            name: Tejas-AI-Windows
          - os: macos-latest
            name: Tejas-AI-macOS
          - os: ubuntu-22.04
            name: Tejas-AI-Linux
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt pyinstaller pillow
      - name: Build the app
        shell: bash
        run: |
          SEP=":"; [ "$RUNNER_OS" = "Windows" ] && SEP=";"
          pyinstaller --noconfirm --windowed --name "Tejas AI" \
            --icon tejas_ai/web/icons/icon-512.png \
            --paths . --add-data "tejas_ai/web${SEP}tejas_ai/web" \
            --collect-submodules tejas_ai --collect-submodules uvicorn --hidden-import sympy \
            --collect-all faster_whisper --collect-all ctranslate2 --collect-all onnxruntime \
            --collect-all piper --collect-all av --collect-all tokenizers \
            --osx-bundle-identifier ai.tejas.desktop \
            desktop/tejas_desktop.py
      - name: Smoke test (server starts and does maths)
        shell: bash
        env:
          TEJAS_OFFLINE: "1"
        run: |
          case "$RUNNER_OS" in
            Windows) BIN="dist/Tejas AI/Tejas AI.exe" ;;
            macOS)   BIN="dist/Tejas AI.app/Contents/MacOS/Tejas AI" ;;
            *)       BIN="dist/Tejas AI/Tejas AI" ;;
          esac
          python - "$BIN" <<'EOF'
          import json, os, subprocess, sys, time, urllib.request
          home = os.path.abspath("smoke-home")
          env = dict(os.environ, TEJAS_AI_HOME=home)
          p = subprocess.Popen([sys.argv[1]], env=env, stdout=subprocess.PIPE, stderr=subprocess.STDOUT)
          stage, last, ok = "status", None, False
          t0 = time.time()
          while time.time() - t0 < 120:
              time.sleep(1)
              try:
                  if stage == "status":
                      s = json.load(urllib.request.urlopen("http://127.0.0.1:8000/api/status", timeout=5))
                      print(f"status ok after {time.time() - t0:.0f}s: {s['version']}"); stage = "chat"
                  r = urllib.request.urlopen(urllib.request.Request("http://127.0.0.1:8000/api/chat",
                      data=b'{"text":"what is 245 times 37"}', headers={"Content-Type": "application/json"}), timeout=60).read().decode()
                  print(r.splitlines()[0]); ok = "9065" in r; break
              except Exception as e:
                  last = f"{type(e).__name__}: {e}"
          p.kill()
          if not ok:
              out = (p.stdout.read() or b"").decode(errors="ignore")[-2000:]
              logf = os.path.join(home, "desktop.log")
              if os.path.exists(logf):
                  out += "\n--- desktop.log ---\n" + open(logf, encoding="utf-8", errors="ignore").read()[-3000:]
              if os.name == "nt":
                  out += "\n--- port 8000 ---\n" + subprocess.run("netstat -ano | findstr :8000", shell=True, capture_output=True, text=True).stdout[-1500:]
              print(out)
              msg = f"failed at {stage}: {last}\n{out}".replace("%", "%25").replace("\r", "").replace("\n", "%0A")
              print(f"::error title=Smoke test::{msg}")
              sys.exit(1)
          EOF
      - name: Package
        shell: bash
        run: |
          mkdir out
          case "$RUNNER_OS" in
            Windows) 7z a -tzip "out/${{ matrix.name }}.zip" "./dist/Tejas AI" >/dev/null ;;
            macOS)   ditto -c -k --keepParent "dist/Tejas AI.app" "out/${{ matrix.name }}.zip" ;;
            *)       tar -C dist -czf "out/${{ matrix.name }}.tar.gz" "Tejas AI" ;;
          esac
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.name }}
          path: out/*
          retention-days: 30
      - name: Publish to the Tejas AI release (direct download links)
        if: github.ref == 'refs/heads/tejas-ai'
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          bash .github/release.sh out/*
