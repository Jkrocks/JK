name: Publish TEJAS ISO (public download, no login)

on:
  workflow_dispatch:
    inputs:
      run_id:
        description: "Build run that made the ISO"
        default: "39276719325"
  push:
    branches: [tejas-os]
    paths: [".github/workflows/publish-iso.yml"]

permissions:
  contents: write
  actions: read

jobs:
  publish:
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    env:
      GH_TOKEN: ${{ github.token }}
      TAG: tejas-os-v1.0
      RUN_ID: ${{ inputs.run_id || '39276719325' }}
    steps:
      - name: Make room
        run: |
          sudo rm -rf /usr/share/dotnet /usr/local/lib/android /opt/ghc /opt/hostedtoolcache /usr/local/share/boost
          df -h /
      - uses: actions/download-artifact@v4
        with:
          name: tejas-1.0-amd64
          path: iso
          run-id: ${{ env.RUN_ID }}
          github-token: ${{ github.token }}
      - name: Cut into pieces under GitHub's 2 GB limit
        run: |
          cd iso
          ISO=$(ls *.iso | head -1)
          ls -l
          sha256sum "$ISO" | tee "$ISO.sha256"
          split -b 1900M -d -a 3 --numeric-suffixes=1 "$ISO" "$ISO."
          rm "$ISO"
          PARTS=$(ls "$ISO".0* | xargs -n1 basename)
          PLUS=$(echo $PARTS | sed 's/ / + /g')
          HASH=$(cut -d' ' -f1 "$ISO.sha256")
          printf '%s\r\n' \
            '@echo off' \
            'cd /d "%~dp0"' \
            'echo.' \
            'echo  TEJAS: joining the pieces into one file. Please wait about a minute...' \
            'echo.' \
            "copy /b $PLUS \"$ISO\" >nul" \
            "if not exist \"$ISO\" (echo  Something is missing. Put all the pieces and this file in the same folder. & pause & exit /b 1)" \
            'echo  Checking the file (another minute)...' \
            "certutil -hashfile \"$ISO\" SHA256 | findstr /i \"$HASH\" >nul && (echo. & echo  DONE! $ISO is ready and perfect. Now flash it to a USB stick with Rufus.) || (echo. & echo  The check failed: one piece did not download fully. Download it again.)" \
            'echo.' \
            'pause' > JOIN-TEJAS-WINDOWS.bat
          printf '#!/bin/sh\n# Mac / Linux: join the TEJAS pieces into one ISO\ncd "$(dirname "$0")"\ncat %s > "%s" && shasum -a 256 "%s"\necho "Expected: %s"\n' "$PARTS" "$ISO" "$ISO" "$HASH" > join-tejas-mac-linux.sh
          ls -l
      - name: Upload to the release
        run: |
          NOTES="TEJAS OS 1.0: free desktop operating system (Debian 13 + KDE Plasma).

          How to download (no GitHub account needed):
          1. Download ALL the pieces (TEJAS-...iso.001, .002, .003) and JOIN-TEJAS-WINDOWS.bat into the same folder.
          2. Double-click JOIN-TEJAS-WINDOWS.bat. It makes one TEJAS .iso file and checks it.
          3. Flash the .iso to an 8 GB+ USB stick with Rufus (rufus.ie) or balenaEtcher, then boot from it."
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" >/dev/null 2>&1 || \
            gh release create "$TAG" -R "$GITHUB_REPOSITORY" --target tejas-os --title "TEJAS OS 1.0" --notes "$NOTES" --latest=false
          for f in iso/*; do
            for i in 1 2 3; do gh release upload "$TAG" "$f" -R "$GITHUB_REPOSITORY" --clobber && break || sleep 20; done
          done
          gh release view "$TAG" -R "$GITHUB_REPOSITORY" --json assets -q '.assets[]|"\(.name) \(.size)"'
