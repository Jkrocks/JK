name: iOS app
on:
  push:
    paths: ["mobile/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        working-directory: mobile/ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build (unsigned)
        working-directory: mobile/ios
        run: |
          xcodebuild -project TejasAI.xcodeproj -scheme TejasAI -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          test -d build/Build/Products/Release-iphoneos/TejasAI.app
      - name: Package unsigned IPA
        working-directory: mobile/ios
        run: |
          mkdir -p Payload out
          cp -R build/Build/Products/Release-iphoneos/TejasAI.app Payload/
          zip -qry out/Tejas-AI-iOS-unsigned.ipa Payload
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Tejas-AI-iOS
          path: mobile/ios/out/Tejas-AI-iOS-unsigned.ipa
          retention-days: 30
