name: iOS app
on:
  push:
    paths: ["mobile/**", ".github/workflows/ios.yml"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ipa:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate Xcode project
        working-directory: mobile/ios
        run: |
          brew install xcodegen
          xcodegen generate
      - name: Build (unsigned)
        working-directory: mobile/ios
        run: |
          xcodebuild -project TejasAI.xcodeproj -scheme TejasAI -configuration Release \
            -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO CODE_SIGNING_REQUIRED=NO CODE_SIGN_IDENTITY="" build | tail -40
          test -d build/Build/Products/Release-iphoneos/TejasAI.app
      - name: Package unsigned IPA
        working-directory: mobile/ios
        run: |
          mkdir -p Payload out
          cp -R build/Build/Products/Release-iphoneos/TejasAI.app Payload/
          zip -qry out/Tejas-AI-iOS-unsigned.ipa Payload
          ls -la out
      - uses: actions/upload-artifact@v4
        with:
          name: Tejas-AI-iOS
          path: mobile/ios/out/Tejas-AI-iOS-unsigned.ipa
          retention-days: 30
      - name: AltStore / SideStore source
        working-directory: mobile/ios
        run: |
          python3 - <<'PY'
          import json, os, datetime
          tag = "tejas-ai-v1.0.0"
          base = f"https://github.com/Jkrocks/JK/releases/download/{tag}"
          ipa = "out/Tejas-AI-iOS-unsigned.ipa"
          size = os.path.getsize(ipa)
          today = datetime.date.today().isoformat()
          icon = "https://raw.githubusercontent.com/Jkrocks/JK/tejas-ai/mobile/ios/Resources/Assets.xcassets/AppIcon.appiconset/icon-1024.png"
          desc = ("Tejas is your family's offline AI companion. It listens, talks back in a warm voice, helps with homework, "
                  "solves maths exactly, tells stories, sets reminders and reads the news. Its brain runs on your own home "
                  "computer (Tejas desktop app); this app finds it on your Wi-Fi.")
          src = {"name": "Tejas AI", "identifier": "ai.tejas.source", "subtitle": "Family home assistant", "iconURL": icon,
                 "website": "https://github.com/Jkrocks/JK/tree/tejas-ai", "tintColor": "74F0C9", "news": [],
                 "apps": [{"name": "Tejas AI", "bundleIdentifier": "ai.tejas.app", "developerName": "Jaspal Khalsa",
                           "subtitle": "Your family's offline companion", "localizedDescription": desc, "iconURL": icon,
                           "tintColor": "74F0C9", "version": "1.0.0", "versionDate": today,
                           "downloadURL": f"{base}/Tejas-AI-iOS-unsigned.ipa", "size": size,
                           "versions": [{"version": "1.0.0", "buildVersion": "1", "date": today, "minOSVersion": "15.0",
                                         "downloadURL": f"{base}/Tejas-AI-iOS-unsigned.ipa", "size": size}],
                           "appPermissions": {"entitlements": [], "privacy": {
                               "NSMicrophoneUsageDescription": "Tejas listens when you tap the orb, so you can talk to it.",
                               "NSLocalNetworkUsageDescription": "Tejas looks for your family's home computer on your Wi-Fi."}}}]}
          json.dump(src, open("out/altstore-source.json", "w"), indent=2)
          PY
      - name: Publish to the Tejas AI release (direct download links)
        if: github.ref == 'refs/heads/tejas-ai'
        env:
          GH_TOKEN: ${{ github.token }}
        run: bash .github/release.sh mobile/ios/out/Tejas-AI-iOS-unsigned.ipa mobile/ios/out/altstore-source.json
